services:
  anydrop:
    # 使用已发布的镜像：可固定版本、可回滚。
    #   固定版本：在 .env 中设置 ANYDROP_VERSION=v1.2.3，然后 docker compose pull && docker compose up -d --no-build
    #   跟随最新：保持默认 latest
    # 下方保留 build 段以便从源码构建；docker compose up -d --build 仍可用。
    image: ghcr.io/kopelan/anydrop:${ANYDROP_VERSION:-latest}
    build:
      context: .
      dockerfile: AnyDrop/Dockerfile
    container_name: anydrop
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 持久化 SQLite 数据库和上传文件
      - anydrop-data:/data
    environment:
      # ── 必填：JWT 签名密钥（至少 32 字符）────────────────────────────────────
      # 未设置时 compose 直接报错退出，避免带着空密钥或默认密钥启动。
      # 参考 .env.example 生成并写入 .env。
      - Auth__JwtSecret=${ANYDROP_JWT_SECRET:?未设置 ANYDROP_JWT_SECRET。请复制 .env.example 为 .env 并填写至少 32 字符的随机密钥}
      # ── 存储路径（已在 Dockerfile 中设为 /data，通常无需修改）─────────────────
      - Storage__DatabasePath=/data/anydrop.db
      - Storage__BasePath=/data/files
      # ── 上传文件大小上限（字节），默认 100 MB ────────────────────────────────
      - Storage__MaxFileSizeBytes=${ANYDROP_MAX_FILE_SIZE:-104857600}
      # ── JWT 令牌有效期（小时），默认 24 小时 ─────────────────────────────────
      - Auth__TokenExpiryHours=${ANYDROP_TOKEN_EXPIRY_HOURS:-24}
      # ── 孤儿文件回收（默认只报告不删除）─────────────────────────────────────
      - Storage__OrphanCleanupEnabled=${ANYDROP_ORPHAN_CLEANUP_ENABLED:-false}
      # ── 反向代理（默认关闭）─────────────────────────────────────────────────
      # 启用时务必同时设置 ANYDROP_REVERSE_PROXY_NETWORK 为代理的实际网段，
      # 否则转发头会被忽略，登录限流将退化为所有访问者共享。
      - ReverseProxy__Enabled=${ANYDROP_REVERSE_PROXY_ENABLED:-false}
      - ReverseProxy__KnownNetworks__0=${ANYDROP_REVERSE_PROXY_NETWORK:-}
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      # 使用 /health 而不是首页：首页只能说明 Kestrel 起来了，
      # 数据库损坏或卷写满时它依然返回 200。
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  anydrop-data:
    driver: local
