services:
  anydrop:
    # 使用已发布的镜像：可固定版本、可回滚。
    #   固定版本：在 .env 中设置 ANYDROP_VERSION=v1.2.3，然后 docker compose pull && docker compose up -d --no-build
    #   默认跟随当前正式版本，不再拉 latest（S3-01：latest 浮动不可复现）。
    # 下方保留 build 段以便从源码构建；docker compose up -d --build 仍可用。
    image: ghcr.io/kopelan/anydrop:${ANYDROP_VERSION:-v1.0.0}
    build:
      context: .
      dockerfile: AnyDrop/Dockerfile
    container_name: anydrop
    restart: unless-stopped
    # S3-01：容器内存上限。缩略图大图解码是内存峰值来源（S1-02 已限流），
    # 再叠加并发上传时仍可能冲高；上限防拖垮宿主机，超限时容器会被 OOM
    # 杀掉并按 restart 策略重起，而不是把宿主机拖死。
    deploy:
      resources:
        limits:
          memory: 1024m
        reservations:
          memory: 256m
    ports:
      - "8080:8080"
    volumes:
      # 持久化 SQLite 数据库和上传文件
      - anydrop-data:/data
    environment:
      # ── 必填：JWT 签名密钥（至少 32 字符）────────────────────────────────────
      # 未设置时 compose 直接报错退出，避免带着空密钥或默认密钥启动。
      # 参考 .env.example 生成并写入 .env。
      - Auth__JwtSecret=${ANYDROP_JWT_SECRET:?未设置 ANYDROP_JWT_SECRET。请复制 .env.example 为 .env 并填写至少 32 字符的随机密钥}
      # ── 存储路径（已在 Dockerfile 中设为 /data，通常无需修改）─────────────────
      - Storage__DatabasePath=/data/anydrop.db
      - Storage__BasePath=/data/files
      # ── 上传文件大小上限（字节），默认 100 MB ────────────────────────────────
      - Storage__MaxFileSizeBytes=${ANYDROP_MAX_FILE_SIZE:-524288000}
      # ── JWT 令牌有效期（小时），默认 24 小时 ─────────────────────────────────
      - Auth__TokenExpiryHours=${ANYDROP_TOKEN_EXPIRY_HOURS:-24}
      # ── Data Protection 密钥（S1-05）────────────────────────────────────────
      # Cookie 与防伪令牌的签名密钥默认落到 /data/keys（数据库同目录），随
      # anydrop-data 卷持久化；重建容器后原有登录态不失效。改路径时用本项指定。
      - DataProtection__KeysPath=${ANYDROP_DATA_PROTECTION_KEYS_PATH:-/data/keys}
      # ── 孤儿文件回收（默认只报告不删除）─────────────────────────────────────
      - Storage__OrphanCleanupEnabled=${ANYDROP_ORPHAN_CLEANUP_ENABLED:-false}
      # ── 后台任务时区（D6）───────────────────────────────────────────────────
      # 孤儿对账、过期清理、缩略图批处理按此 IANA 时区调度（例如 Asia/Shanghai）。
      # 留空时用容器内当前计算机时区——容器内通常是 UTC，要与宿主机一致请显式配置；
      # 也可以同时透传宿主机 TZ（须镜像含 tzdata，否则仅影响 .NET 的本地时区读取，
      # BackgroundTasks__TimeZoneId 仍是可靠做法）。
      - BackgroundTasks__TimeZoneId=${ANYDROP_BACKGROUND_TIMEZONE:-}
      - TZ=${TZ:-}
      # ── 反向代理 ──────────────────────────────────────────────────────────
      # 应用本身只监听容器内 plain HTTP 8080，TLS 由前面的反向代理终止；
      # 生产环境默认强制 HTTPS 重定向 + HSTS。启用反代时务必把代理的实际网段
      # 配进 ANYDROP_REVERSE_PROXY_NETWORK，否则转发头会被忽略，登录限流将
      # 退化为所有访问者共享。纯 HTTP 局域网例外：把下面两项同时改为 false / None。
      - ReverseProxy__Enabled=${ANYDROP_REVERSE_PROXY_ENABLED:-false}
      - ReverseProxy__KnownNetworks__0=${ANYDROP_REVERSE_PROXY_NETWORK:-}
      - ReverseProxy__RequireHttps=${ANYDROP_REQUIRE_HTTPS:-true}
      - ReverseProxy__HttpsPort=${ANYDROP_HTTPS_PORT:-443}
      - Auth__CookieSecurePolicy=${ANYDROP_COOKIE_SECURE_POLICY:-Always}
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      # 使用 /health 而不是首页：首页只能说明 Kestrel 起来了，
      # 数据库损坏或卷写满时它依然返回 200。
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  anydrop-data:
    driver: local
