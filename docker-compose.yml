services:
  anydrop:
    build:
      context: .
      dockerfile: AnyDrop/Dockerfile
    image: anydrop:latest
    container_name: anydrop
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 持久化 SQLite 数据库和上传文件
      - anydrop-data:/data
    environment:
      # ── 必填：JWT 签名密钥（至少 32 字符）────────────────────────────────────
      # 未设置时 compose 直接报错退出，避免带着空密钥或默认密钥启动。
      # 参考 .env.example 生成并写入 .env。
      - Auth__JwtSecret=${ANYDROP_JWT_SECRET:?未设置 ANYDROP_JWT_SECRET。请复制 .env.example 为 .env 并填写至少 32 字符的随机密钥}
      # ── 存储路径（已在 Dockerfile 中设为 /data，通常无需修改）─────────────────
      - Storage__DatabasePath=/data/anydrop.db
      - Storage__BasePath=/data/files
      # ── 上传文件大小上限（字节），默认 100 MB ────────────────────────────────
      - Storage__MaxFileSizeBytes=${ANYDROP_MAX_FILE_SIZE:-104857600}
      # ── JWT 令牌有效期（小时），默认 24 小时 ─────────────────────────────────
      - Auth__TokenExpiryHours=${ANYDROP_TOKEN_EXPIRY_HOURS:-24}
      - ASPNETCORE_ENVIRONMENT=Production
    healthcheck:
      # 使用 /health 而不是首页：首页只能说明 Kestrel 起来了，
      # 数据库损坏或卷写满时它依然返回 200。
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  anydrop-data:
    driver: local
