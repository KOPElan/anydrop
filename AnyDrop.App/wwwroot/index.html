<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>AnyDrop</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="AnyDrop.App.styles.css" />
    <link rel="icon" href="data:,">
    <script>
        window.ThemeManager = {
            setTheme: function(mode) {
                if (mode === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('anydrop_theme', mode);
            },
            getTheme: function() {
                return localStorage.getItem('anydrop_theme') || 'light';
            },
            init: function() {
                var saved = localStorage.getItem('anydrop_theme');
                if (saved === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            }
        };
        window.ThemeManager.init();
    </script>
    <script>
        window.scrollUtils = {
            _nearBottomObservers: {},
            _pullToLoadObservers: {},
            scrollToBottom: function(elementId) {
                var el = document.getElementById(elementId);
                if (!el) return;
                el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
                setTimeout(function () {
                    if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
                }, 250);
            },
            isNearBottom: function(elementId, threshold) {
                var el = document.getElementById(elementId);
                if (!el) return true;
                return el.scrollHeight - el.scrollTop - el.clientHeight < threshold;
            },
            setupNearBottomObserver: function (elementId, dotNetRef, threshold) {
                var el = document.getElementById(elementId);
                if (!el || !dotNetRef) return;

                threshold = threshold || 120;
                window.scrollUtils.cleanupNearBottomObserver(elementId);

                var rafId = 0;
                var lastIsNearBottom = null;

                var notifyIfChanged = function () {
                    if (!el) return;
                    var isNearBottom = el.scrollHeight - el.scrollTop - el.clientHeight < threshold;
                    if (lastIsNearBottom === isNearBottom) return;
                    lastIsNearBottom = isNearBottom;
                    dotNetRef.invokeMethodAsync('OnNearBottomChanged', isNearBottom)
                        .catch(function () { });
                };

                var onScroll = function () {
                    if (rafId) return;
                    rafId = requestAnimationFrame(function () {
                        rafId = 0;
                        notifyIfChanged();
                    });
                };

                el.addEventListener('scroll', onScroll, { passive: true });
                notifyIfChanged();

                window.scrollUtils._nearBottomObservers[elementId] = function () {
                    el.removeEventListener('scroll', onScroll);
                    if (rafId) {
                        cancelAnimationFrame(rafId);
                        rafId = 0;
                    }
                };
            },
            cleanupNearBottomObserver: function (elementId) {
                var cleanup = window.scrollUtils._nearBottomObservers[elementId];
                if (!cleanup) return;
                cleanup();
                delete window.scrollUtils._nearBottomObservers[elementId];
            },
            /**
             * 为滚动容器开启下拉加载更多：当列表已滚到顶部并继续下拉超过 triggerDistance 时触发回调。
             * 使用 touch 事件实现，不影响正常滚动。
             */
            setupPullToLoad: function (elementId, dotNetRef, triggerDistance) {
                var el = document.getElementById(elementId);
                if (!el || !dotNetRef) return;
                triggerDistance = triggerDistance || 60;
                window.scrollUtils.cleanupPullToLoad(elementId);

                var startY = 0;
                var pulling = false;
                var indicator = el.querySelector('.pull-to-load-indicator');

                var onTouchStart = function (e) {
                    if (el.scrollTop > 5) return; // 未滚到顶部，忽略
                    if (e.touches.length !== 1) return;
                    startY = e.touches[0].clientY;
                    pulling = true;
                };

                var onTouchMove = function (e) {
                    if (!pulling) return;
                    var dy = e.touches[0].clientY - startY;
                    if (dy <= 0) { pulling = false; return; }
                    if (el.scrollTop > 5) { pulling = false; return; }
                    if (indicator) {
                        var pct = Math.min(dy / triggerDistance, 1);
                        indicator.style.opacity = pct;
                        indicator.style.transform = 'translateY(' + Math.min(dy * 0.4, 24) + 'px)';
                    }
                };

                var onTouchEnd = function (e) {
                    if (!pulling) return;
                    pulling = false;
                    var endY = e.changedTouches[0].clientY;
                    var dy = endY - startY;
                    if (indicator) {
                        indicator.style.opacity = 0;
                        indicator.style.transform = '';
                    }
                    if (dy >= triggerDistance) {
                        dotNetRef.invokeMethodAsync('OnPullToLoad').catch(function () { });
                    }
                };

                el.addEventListener('touchstart', onTouchStart, { passive: true });
                el.addEventListener('touchmove', onTouchMove, { passive: true });
                el.addEventListener('touchend', onTouchEnd, { passive: true });

                window.scrollUtils._pullToLoadObservers[elementId] = function () {
                    el.removeEventListener('touchstart', onTouchStart);
                    el.removeEventListener('touchmove', onTouchMove);
                    el.removeEventListener('touchend', onTouchEnd);
                };
            },
            cleanupPullToLoad: function (elementId) {
                var cleanup = window.scrollUtils._pullToLoadObservers[elementId];
                if (!cleanup) return;
                cleanup();
                delete window.scrollUtils._pullToLoadObservers[elementId];
            }
        };
        window.blazorCulture = {
            get: () => window.localStorage['blazorCulture'],
            set: (value) => window.localStorage['blazorCulture'] = value
        };
    </script>
</head>
<body>
    <div class="status-bar-safe-area"></div>
    <div id="app">Loading...</div>
    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
